services:
  merchant-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: merchant-growiota
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/merchant.db
      - JWT_SECRET=merchant-growiota-production-secret-key-2026
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - SARVAM_STT_MODEL=saaras:v4
      - SARVAM_TTS_MODEL=bulbul:v4-flash
      - SARVAM_LLM_MODEL=sarvam-105b
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PAYTM_MID=${PAYTM_MID}
      - PAYTM_MERCHANT_KEY=${PAYTM_MERCHANT_KEY}
      - PAYTM_ENVIRONMENT=STAGE
    volumes:
      - merchant-db-data:/app/data

volumes:
  merchant-db-data:
    driver: local

